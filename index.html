<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 { margin: 0; }

    .cart {
      cursor: pointer;
      font-size: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px 5%;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #ddd;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #cartBox {
      position: fixed;
      right: 20px;
      top: 70px;
      width: 300px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 15px #aaa;
      display: none;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <header>
    <h2>MiniShop</h2>
    <div class="cart" onclick="toggleCart()">
      🛒 Cart (<span id="count">0</span>)
    </div>
  </header>

  <main class="products">

    <div class="product">
      <img src="https://picsum.photos/300/200?1" alt="T-Shirt">
      <h3>T-Shirt</h3>
      <p class="price">$20</p>
      <button onclick="addToCart('T-Shirt', 20)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?2" alt="Shoes">
      <h3>Shoes</h3>
      <p class="price">$50</p>
      <button onclick="addToCart('Shoes', 50)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?3" alt="Watch">
      <h3>Watch</h3>
      <p class="price">$80</p>
      <button onclick="addToCart('Watch', 80)">Add to Cart</button>
    </div>

  </main>

  <div id="cartBox">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <hr>
    <strong>Total: $<span id="total">0</span></strong>
    <br><br>
    <button onclick="checkout()">Checkout</button>
  </div>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCart();
    }

    function updateCart() {
      document.getElementById("count").textContent = cart.length;

      let items = document.getElementById("cartItems");
      let total = 0;

      items.innerHTML = "";

      cart.forEach((item, index) => {
        total += item.price;

        items.innerHTML += `
          <div class="cart-item">
            <span>${item.name} - $${item.price}</span>
            <button onclick="removeItem(${index})">×</button>
          </div>
        `;
      });

      document.getElementById("total").textContent = total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      const box = document.getElementById("cartBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
      } else {
        alert("Order placed successfully!");
        cart = [];
        updateCart();
      }
    }
  </script>

</body>
</html>
